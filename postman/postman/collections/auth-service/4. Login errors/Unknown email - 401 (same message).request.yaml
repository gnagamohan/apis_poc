$kind: http-request
name: Unknown email -> 401 (same message)
url: '{{baseUrl}}/auth/login'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "nobody@example.com",
      "password": "whatever"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
    pm.test('RFC 7807 problem body', () => {
      pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
      const p = pm.response.json();
      pm.expect(p.status).to.eql(401);
      pm.expect(p.title).to.eql('Unauthorized');
      pm.expect(p.detail).to.include('Invalid email or password');
    });
    pm.test('No token returned', () => pm.expect(pm.response.json()).to.not.have.property('access_token'));
  language: text/javascript
order: 2000
