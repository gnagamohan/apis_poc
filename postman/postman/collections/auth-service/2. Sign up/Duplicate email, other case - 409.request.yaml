$kind: http-request
name: Duplicate email, other case -> 409
url: '{{baseUrl}}/auth/signup'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{signupEmailUpper}}",
      "password": "{{signupPassword}}"
    }
scripts:
- type: beforeRequest
  code: pm.collectionVariables.set('signupEmailUpper', pm.collectionVariables.get('signupEmail').toUpperCase());
  language: text/javascript
- type: afterResponse
  code: |-
    pm.test('409 Conflict', () => pm.response.to.have.status(409));
    pm.test('RFC 7807 problem body', () => {
      pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
      const p = pm.response.json();
      pm.expect(p.status).to.eql(409);
      pm.expect(p.title).to.eql('Conflict');
      pm.expect(p.detail).to.include('already exists');
    });
    pm.test('No token returned', () => pm.expect(pm.response.json()).to.not.have.property('access_token'));
  language: text/javascript
order: 5000
