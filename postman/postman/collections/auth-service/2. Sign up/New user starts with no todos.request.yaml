$kind: http-request
url: '{{baseUrl}}/api/todos'
method: GET
headers:
  Authorization: Bearer {{signupToken}}
scripts:
- type: afterResponse
  code: |-
    pm.test('200 OK', () => pm.response.to.have.status(200));
    pm.test('Empty list', () => pm.expect(pm.response.json()).to.eql([]));
  language: text/javascript
order: 3000
