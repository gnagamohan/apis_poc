$kind: http-request
url: '{{baseUrl}}/auth/password/change'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{changeToken}}
body:
  type: json
  content: |-
    {
      "currentPassword": "original-pass-1",
      "newPassword": "brand-new-pass-1"
    }
scripts:
- type: afterResponse
  code: pm.test('204 No Content', () => pm.response.to.have.status(204));
  language: text/javascript
order: 7000
