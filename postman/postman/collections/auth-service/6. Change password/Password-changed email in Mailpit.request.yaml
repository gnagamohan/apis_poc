$kind: http-request
url: '{{baseUrl}}/mailpit/api/v1/search?query=to:{{changeEmail}}'
method: GET
scripts:
- type: afterResponse
  code: |-
    const want = 'Your apis-poc password was changed';
    const msgs = (pm.response.json().messages || []).filter(m => m.Subject === want);
    const tries = Number(pm.collectionVariables.get('mailRetries_changedMessageId') || 0);
    if (msgs.length === 0 && tries < 20) {
      // not there yet: run this request again in 0.5 s (Collection Runner / newman)
      pm.collectionVariables.set('mailRetries_changedMessageId', tries + 1);
      postman.setNextRequest(pm.info.requestName);
      setTimeout(() => {}, 500);
    } else {
      pm.collectionVariables.unset('mailRetries_changedMessageId');
      pm.test('Email arrived in Mailpit', () => pm.expect(msgs.length).to.be.above(0));
      if (msgs.length) pm.collectionVariables.set('changedMessageId', msgs[0].ID);
    }
  language: text/javascript
order: 10000
