$kind: http-request
url: '{{baseUrl}}/auth/password/change'
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{changeToken}}
body:
  type: json
  content: |-
    {
      "currentPassword": "not-my-password",
      "newPassword": "brand-new-pass-1"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('403 Forbidden', () => pm.response.to.have.status(403));
    pm.test('RFC 7807 problem body', () => {
      pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
      const p = pm.response.json();
      pm.expect(p.status).to.eql(403);
      pm.expect(p.title).to.eql('Forbidden');
      pm.expect(p.detail).to.include('Current password is incorrect');
    });
    pm.test('No token returned', () => pm.expect(pm.response.json()).to.not.have.property('access_token'));
  language: text/javascript
order: 4000
