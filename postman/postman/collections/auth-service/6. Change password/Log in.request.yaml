$kind: http-request
url: '{{baseUrl}}/auth/login'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{changeEmail}}",
      "password": "original-pass-1"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('200', () => pm.response.to.have.status(200));
    pm.collectionVariables.set('changeToken', pm.response.json().access_token);
  language: text/javascript
order: 2000
