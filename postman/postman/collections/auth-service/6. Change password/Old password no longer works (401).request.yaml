$kind: http-request
url: '{{baseUrl}}/auth/login'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{changeEmail}}",
      "password": "original-pass-1"
    }
scripts:
- type: afterResponse
  code: pm.test('401', () => pm.response.to.have.status(401));
  language: text/javascript
order: 8000
