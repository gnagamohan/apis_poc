$kind: http-request
url: '{{baseUrl}}/auth/password/change'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "original-pass-1",
      "newPassword": "brand-new-pass-1"
    }
scripts:
- type: afterResponse
  code: pm.test('401 Unauthorized', () => pm.response.to.have.status(401));
  language: text/javascript
order: 3000
