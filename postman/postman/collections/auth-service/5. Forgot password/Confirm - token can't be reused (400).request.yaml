$kind: http-request
url: '{{baseUrl}}/auth/password-reset/confirm'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "newPassword": "yet-another-pass-1"
    }
scripts:
- type: afterResponse
  code: |-
    pm.test('400 Bad Request', () => pm.response.to.have.status(400));
    pm.test('RFC 7807 problem body', () => {
      pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json');
      const p = pm.response.json();
      pm.expect(p.status).to.eql(400);
      pm.expect(p.title).to.eql('Bad Request');
      pm.expect(p.detail).to.include('invalid, expired or already used');
    });
    pm.test('No token returned', () => pm.expect(pm.response.json()).to.not.have.property('access_token'));
  language: text/javascript
order: 10000
