$kind: http-request
url: '{{baseUrl}}/auth/password-reset/confirm'
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "newPassword": "brand-new-pass-1"
    }
scripts:
- type: afterResponse
  code: pm.test('204 No Content', () => pm.response.to.have.status(204));
  language: text/javascript
order: 9000
