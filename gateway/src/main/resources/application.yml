server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # Trust X-Forwarded-* headers from nginx on the private docker networks
          trusted-proxies: '10\..*|172\.(1[6-9]|2[0-9]|3[0-1])\..*|192\.168\..*'
          routes:
            - id: todo-service
              uri: ${TODO_SERVICE_URI:http://localhost:8081}
              predicates:
                - Path=/api/todos,/api/todos/**
            - id: todo-mcp
              uri: ${TODO_MCP_URI:http://localhost:9000}
              predicates:
                - Path=/mcp
            - id: auth-service
              uri: ${AUTH_SERVICE_URI:http://localhost:9001}
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1     # /auth/login -> auth-service /login

# JWTs issued by auth-service (HS256, shared secret)
auth:
  jwt:
    secret: ${JWT_SECRET}
    issuer: auth-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
