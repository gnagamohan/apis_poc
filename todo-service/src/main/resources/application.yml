server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: todo-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:tododb}
    username: ${DB_USER:todo_app}
    password: ${DB_PASSWORD:todo_app_pw}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    placeholders:
      # owner for todos that existed before authentication (used once, by V2)
      legacyOwnerEmail: ${TODO_LEGACY_OWNER_EMAIL:demo@example.com}
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
