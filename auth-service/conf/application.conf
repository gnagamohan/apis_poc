play.http.secret.key = "change-me-dev-only-secret-key-at-least-32-bytes-long"
play.http.secret.key = ${?PLAY_HTTP_SECRET_KEY}

play.server.http.port = 9000

# JSON API only: no CSRF (no cookies / forms); reached via the gateway with arbitrary Host headers.
play.filters.disabled += play.filters.csrf.CSRFFilter
play.filters.hosts.allowed = ["."]

play.modules.enabled += "auth.AuthModule"

# ---------------------------------------------------------------- database (authdb)
db.default {
  driver = org.postgresql.Driver
  url = "jdbc:postgresql://localhost:5432/authdb"
  url = ${?DB_URL}
  username = "auth_app"
  username = ${?DB_USER}
  password = "auth_app_pw"
  password = ${?DB_PASSWORD}
  hikaricp.maximumPoolSize = 5
}
play.evolutions.db.default.autoApply = true

# Blocking JDBC + BCrypt work runs here, not on Play's request threads
database.dispatcher {
  executor = "thread-pool-executor"
  throughput = 1
  thread-pool-executor {
    fixed-pool-size = 5
  }
}

# ---------------------------------------------------------------- JWT
jwt {
  # HS256 signing key, at least 32 bytes
  secret = "change-me-dev-only-jwt-secret-at-least-32-bytes"
  secret = ${?JWT_SECRET}
  issuer = "auth-service"
  ttl = 10 minutes
}

# ---------------------------------------------------------------- email (SMTP; Mailpit in docker-compose)
mail {
  smtp.host = "localhost"
  smtp.host = ${?SMTP_HOST}
  smtp.port = 1025
  smtp.port = ${?SMTP_PORT}
  from = "apis-poc <no-reply@apis-poc.local>"
  from = ${?MAIL_FROM}
}

# ---------------------------------------------------------------- password reset
passwordReset {
  ttl = 15 minutes
  # used in the reset email's instructions
  publicBaseUrl = "http://localhost"
  publicBaseUrl = ${?PUBLIC_BASE_URL}
}

# ---------------------------------------------------------------- seed user (created on startup if missing)
auth.seedUser {
  email = ""
  email = ${?AUTH_SEED_USER_EMAIL}
  password = ""
  password = ${?AUTH_SEED_USER_PASSWORD}
}
