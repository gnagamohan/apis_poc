play.http.secret.key = "change-me-dev-only-secret-key-at-least-32-bytes-long"
play.http.secret.key = ${?PLAY_HTTP_SECRET_KEY}

play.server.http.port = 9000

# JSON API only: no CSRF (no cookies / forms). Host header is checked by Origin validation instead.
play.filters.disabled += play.filters.csrf.CSRFFilter
play.filters.hosts.allowed = ["."]

# Base URL of the to-do REST API (called through the gateway)
todo.api.baseUrl = "http://localhost/api/todos"
todo.api.baseUrl = ${?TODO_API_BASE_URL}

# Allowed browser Origins (DNS-rebinding protection required by the MCP spec).
# Requests without an Origin header (non-browser clients) are always allowed.
mcp.allowedOriginHosts = ["localhost", "127.0.0.1", "[::1]"]

mcp.server.name = "todo-mcp"
mcp.server.version = "1.0.0"

play.ws.timeout.connection = 5 seconds
play.ws.timeout.request = 15 seconds
