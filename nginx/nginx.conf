# Single entry point: /api/** -> Spring Cloud Gateway, /pgadmin/ -> pgAdmin

upstream gateway_upstream {
    server gateway:8080;
}

upstream pgadmin_upstream {
    server pgadmin:80;
}

upstream mailpit_upstream {
    server mailpit:8025;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location = /health {
        default_type application/json;
        return 200 '{"status":"UP"}';
    }

    # APIs -> gateway
    location /api/ {
        proxy_pass         http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
    }

    # Auth -> gateway -> auth-service (/auth/login -> /login)
    location /auth/ {
        proxy_pass         http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
    }

    # MCP (Streamable HTTP) -> gateway -> todo-mcp
    location = /mcp {
        proxy_pass         http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   X-Forwarded-Port  $server_port;
        # streaming-friendly: don't buffer, allow long-running requests
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
    }

    # Mailpit (dev mail catcher: password-reset emails) under /mailpit/
    location = /mailpit {
        return 301 /mailpit/;
    }

    location /mailpit/ {
        proxy_pass         http://mailpit_upstream;   # Mailpit itself serves under /mailpit/ (MP_WEBROOT)
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;     # live updates over websocket
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # pgAdmin under /pgadmin/
    location = /pgadmin {
        return 301 /pgadmin/;
    }

    location /pgadmin/ {
        proxy_pass         http://pgadmin_upstream/;
        proxy_http_version 1.1;
        proxy_set_header   X-Script-Name     /pgadmin;
        proxy_set_header   X-Scheme          $scheme;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_redirect     off;
        proxy_read_timeout 300s;
    }

    # Landing page with links
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # Login page: get a JWT from /auth/login in the browser
    location = /login {
        root /usr/share/nginx/html;
        try_files /login.html =404;
    }

    # Sign-up page: create an account via /auth/signup
    location = /signup {
        root /usr/share/nginx/html;
        try_files /signup.html =404;
    }

    location / {
        return 404;
    }
}
